services:
  # ==============================================================================
  # FastAPI Python Backend
  # ==============================================================================
  - type: web
    name: smarthostel-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smarthostel-db
          property: connectionString
      - key: JWT_SECRET
        value: supersecretkey_smarthostel_dbms_project_2026
      - key: ALLOWED_ORIGINS
        value: "*"

  # ==============================================================================
  # React Vite Frontend (Static Site)
  # ==============================================================================
  - type: web
    name: smarthostel-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://smarthostel-api.onrender.com/api

databases:
  # ==============================================================================
  # Free PostgreSQL Database
  # ==============================================================================
  - name: smarthostel-db
    databaseName: smarthostel
    user: dbadmin
    region: oregon
    plan: free
