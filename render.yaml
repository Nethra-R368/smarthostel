services:
  # ==============================================================================
  # FastAPI Python Backend (Render Web Service)
  # ==============================================================================
  - type: web
    name: smarthostel-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smarthostel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://smarthostel-frontend.onrender.com,http://localhost:5173"

  # ==============================================================================
  # React Vite Frontend (Render Static Site)
  # ==============================================================================
  - type: static
    name: smarthostel-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://smarthostel-api.onrender.com/api
      - key: VITE_API_URL
        value: https://smarthostel-api.onrender.com/api

databases:
  # ==============================================================================
  # Managed PostgreSQL Database (Render PostgreSQL)
  # ==============================================================================
  - name: smarthostel-db
    databaseName: smarthostel
    user: dbadmin
    region: oregon
    plan: free
